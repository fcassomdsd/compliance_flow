stages:
  - validate
  - release

# data/flows.json is the entire service, so a duplicate id or a wire/link that
# points at a node that no longer exists only surfaces at runtime. Validate the
# structure on every merge request instead.
validate:flows:
  stage: validate
  image: node:20-alpine
  script:
    - node scripts/validate-flows.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

compute_release_tag:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "RELEASE_TAG=$(date +%Y-%m-%d)" >> release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    description: "Release $RELEASE_TAG"
    ref: '$CI_COMMIT_SHA'
