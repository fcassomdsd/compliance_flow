name: CI

# Mirror of this repository's GitLab CI validation job, published on GitHub purely for public
# visibility (GitLab remains the source of truth for development — see CONTRIBUTING.md). Only
# the correctness-signal jobs are mirrored here; release automation and anything else specific
# to the GitLab workflow stays GitLab-only.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # data/flows.json is the entire service, so a duplicate id or a wire/link that points at a
      # node that no longer exists only surfaces at runtime. Validate the structure, verify the
      # README endpoint manifest still matches the flow's http-in nodes, and unit-check the
      # JavaScript embedded in the function nodes — all without a stack.
      - run: node --test scripts/flows-files.test.mjs
      - run: node --test scripts/secrets.test.mjs
      - run: node scripts/assemble-flows.mjs --check
      - run: node scripts/split-flows.mjs --check
      - run: node scripts/validate-flows.mjs
      - run: node scripts/verify-endpoints.mjs
      - run: node scripts/verify-flow-logic.mjs

  security-scan:
    # Supply-chain scanning (P3.2). Gate policy chosen from measurement:
    # CRITICAL is blocking (measured at zero across all six repos, so the gate
    # is green today and stops regressions); HIGH is reported but not blocking
    # while 33 known-fixable findings are cleared, because a gate that is red
    # on arrival gets switched off, and a disabled gate still reads as
    # protection. --skip-dirs excludes generated/bind-mounted runtime trees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '1'
      - name: Report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '0'
