################################################################################
# Node-RED Stack or Compose
################################################################################
# docker stack deploy node-red --compose-file docker-compose-node-red.yml
# docker-compose -f docker-compose-node-red.yml -p myNoderedProject up
################################################################################

services:
  node-red:
    image: nodered/node-red:4.1.10
    environment:
      - TZ=Europe/Amsterdam
      # Credentials have no fallback: copy .env.example to .env and supply real
      # values. compose refuses to start if any of these is unset.
      - ALFRESCO_USERNAME=${ALFRESCO_USERNAME:?ALFRESCO_USERNAME must be set}
      - ALFRESCO_PASSWORD=${ALFRESCO_PASSWORD:?ALFRESCO_PASSWORD must be set}
      - ATROCORE_USERNAME=${ATROCORE_USERNAME:?ATROCORE_USERNAME must be set}
      - ATROCORE_PASSWORD=${ATROCORE_PASSWORD:?ATROCORE_PASSWORD must be set}
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:?NODE_RED_CREDENTIAL_SECRET must be set}
      - API_KEY=${API_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set}
      - NODE_ENV=${NODE_ENV:-development}
      # Deployment endpoints and request tuning. Defaults match the local stack;
      # the flows read these in their "set env config" function nodes.
      - ATROCORE_BASE_URL=${ATROCORE_BASE_URL:-http://atro-web/api/v1}
      - ALFRESCO_BASE_URL=${ALFRESCO_BASE_URL:-http://proxy:8080/alfresco}
      # Empty = keep the http request node's own default (5s).
      - HTTP_REQUEST_TIMEOUT_MS=${HTTP_REQUEST_TIMEOUT_MS:-}
      # Retry policy for the auth/query/CRUD subflows' upstream calls.
      - HTTP_MAX_RETRIES=${HTTP_MAX_RETRIES:-2}
      - HTTP_RETRY_BACKOFF_MS=${HTTP_RETRY_BACKOFF_MS:-500}
    ports:
      - "1880:1880"
    networks:
      - node-red-net
      - node-backend-net
      - alfresco-net
      - import-net
    volumes:
      - ./data:/data

networks:
  node-red-net:
  node-backend-net:
    name: backend_net
    external: true
  alfresco-net:
    name: alfresco_backend
    external: true
  import-net:
    name: import-backend
    external: true
